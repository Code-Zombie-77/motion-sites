        "In Front des schon seit Kurfürst Georg Wilhelm von der Familie von Briest bewohnten Herrenhauses zu Hohen-Cremmen fiel heller Sonnenschein auf die mittagsstille Dorfstraße, während nach der Park- und Gartenseite hin ein rechtwinklig angebauter Seitenflügel einen breiten Schatten erst auf einen weiß und grün quadrierten Fliesengang und dann über diesen hinaus auf ein großes, in seiner Mitte mit einer Sonnenuhr und an seinem Rande mit Canna indica und Rhabarberstauden besetztes Rondell warf.",
        "Einige zwanzig Schritte weiter, in Richtung und Lage genau dem Seitenflügel entsprechend, lief eine ganz in kleinblättrigem Efeu stehende, nur an einer Stelle von einer kleinen weißgestrichenen Eisentür unterbrochene Kirchhofsmauer, hinter der der Hohen-Cremmener Schindelturm mit seinem blitzenden, weil neuerdings erst wieder vergoldeten Wetterhahn aufragte. Fronthaus, Seitenflügel und Kirchhofsmauer bildeten ein einen kleinen Ziergarten umschließendes Hufeisen, an dessen offener Seite man eines Teiches mit einem kleinen Steg und angekettetem Boot und dicht daneben einer Schaukel gewahr wurde, deren horizontal liegendes Brett zu Häupten und Füßen an je zwei Stricken hing, die nach oben hin in einen schon etwas schief stehenden Balkenطبق zusammenliefen."
      ],
      [
        "Zwischen dem Teich und dem Rondell aber, und die Schaukel halb versteckend, standen ein paar mächtige alte Platanen. Auch die Front des Herrenhauses – eine mit vier, fünf Stufen einschließende Rampe, darauf eine Reihe grüner Kübel mit großen Agaven stand – gewährte bei dem schönen Wetter einen überaus freundlichen Anblick; angenehmer aber und jedenfalls anheimelnder war der Aufenthalt auf dem im Schatten gelegenen Fliesengange, woselbst Frau von Briest und ihre Tochter Effi schon seit einer halben Stunde mit einer Stickerei beschäftigt saßen, einem Altarteppich, dessen Vollendung sie sich zu Ehren des bevorstehenden Erntedankfestes zum Ziel gesetzt hatten.",
        "Frau von Briest, eine noch schöne Frau von Anfang vierzig, wohlkonserviert und von einer fast mädchenhaften Rüstigkeit, trug ein schwarzes Seidenkleid und ein weißes Spitzentuch, während Effi in einem blau und weiß gestreiften, halb kittelartigen Leinwandkleide steckte, dem erst ein fest zusammengezogener bronzebrauner Ledergürtel die Taille gab; der Hals war frei, und über Schulter und Nacken fiel ein breiter Matrosenkragen. In allem, was sie tat, paarte sich Übermut und Grazie, während ihre lachenden braunen Augen eine große, natürliche Klugheit und viel Lebenslust und Herzensgüte verrieten."
      ],
      [
        "Man nannte sie die „Kleine“, was sie sich gefallen lassen mußte, weil die schöne schlanke Mama noch um Handbreite höher war als sie. Eeben aber hatte sich Effi wieder erhoben, um nach links und rechts hin allerlei turnerische Drehungen zu machen, wobei sie die Arme hob und die Hände über dem Kopf zusammenlegte. „Effi, eigentlich hättest du doch wohl Kunstreiterin werden müssen“, sagte Frau von Briest, indem sie von ihrer Arbeit aufsah. „Immer am Trapez, immer an der Schnur. Ich glaube beinah, du möchtest auch, daß ich dir so was wie ein kurzes Kleidchen machte.“",
        "„Warum nicht, Mama? Wenn es nur hübsch ist. Und dann, wer käme denn hierher? Niemand als Vetter Dagobert und Pastor Niemeyer; der eine ist mein Onkel, oder so gut wie mein Onkel, und der andere hat mich eingesegnet. Vor wem soll ich mich denn genieren?“ „Vor mir, Effi. Du bist doch nun siebzehn.“ „Ach, siebzehn ist noch gar nichts, Mama. Da bin ich ja noch ein halbes Kind. Und du sagst es ja selbst immer.“"
      ],
      [
        "In diesem Augenblick traten drei junge Mädchen durch das kleine eiserne Gittertor des Kirchhofs und schritten auf einem schmalen Kieswege zwischen den Efeuranken und dem Rondell auf die Veranda zu. Es waren Hulda Niemeyer, des Pastors einziges Kind, und die Zwillingsschwestern Bertha und Hertha Jahnke, Töchter des Kantors, alle drei mit Effi befreundet und fast täglich im Herrenhause zu Gast.",
        "Effi flog ihnen entgegen, küßte jede auf die Wange und rief: „Ihr kommt gerade zur rechten Zeit; Mama wollte mir eben wieder eine Predigt halten, weil ich ein bißchen geturnt habe. Aber nun laßt wir die Stickerei liegen; das Wetter ist viel zu schön, um stillzusitzen, und an der Schaukel im Platanenschatten weht ein herrlicher Wind vom Teiche herüber.“"
      ]
    ]
  },
  "venedig": {
    "pages": [
      [
        "Gustav Aschenbach oder von Aschenbach, wie seit seinem fünfzigsten Geburtstag amtlich sein Name lautete, hatte an einem Frühlingsnachmittag des Jahres 19.., der unserem Kontinent monatelang eine so gefahrdrohende Miene zeigte, von seiner Wohnung in der Prinzregentenstraße zu München aus allein einen weiteren Spaziergang unternommen.",
        "Überreizt von der schwierigen und gefährlichen, eben jetzt eine höchste Behutsamkeit, Umsicht, Eindringlichkeit und Genauigkeit des Willens erfordernden Arbeit der Vormittagsstunden, hatte der Schriftsteller dem Fortschwingen des produzierenden Triebwerkes in seinem Innern, jenem „motus animi continuus“, worin nach Cicero das Wesen der Beredsamkeit besteht, auch nach der Mittagsmahlzeit nicht Einhalt zu tun vermocht und den entlastenden Schlummer nicht gefunden, der ihm, bei zunehmender Abnutzbarkeit seiner Kräfte, einmal untertags so nötig war."
      ],
      [
        "So hatte er bald nach dem Tee das Freie gesucht, in der Hoffnung, daß Luft und Bewegung ihn wiederherstellen und ihm zu einem fruchtbaren Abend verhelfen würden. Es war Anfang Mai und, nach kalten und nassen Wochen, ein falscher Hochsommer eingefallen. Der Englische Garten, obgleich nur erst zart belaubt, war dumpfig wie im August und in der Nähe der Stadt voller Wagen und Spaziergänger gewesen.",
        "Bei der Aumeisterei, wohin stille und immer stillere Wege ihn geführt, hatte Aschenbach eine Weile das volkstümlich belebte Wirtsgärtchen überblickt, an dessen Rande einige Droschken und Equipagen hielten, hatte von dort bei sinkender Sonne seinen Heimweg außerhalb des Parks über die offene Flur genommen und erwartete, da er sich müde fühlte und über Föhring Gewitter drohte, am Nördlichen Friedhof die Tram, die ihn in gerader Linie zur Stadt zurückbringen sollte."
      ],
      [
        "Zufällig fand er den Halteplatz und seine Umgebung von Menschen leer. Weder auf der gepflasterten Ungererstraße, deren Schienengeleise einsam gleißend gegen Schwabing liefen, noch auf der Föhringer Chaussee war ein Fuhrwerk zu sehen; hinter den Zäunen der Steinmetzleyen, wo zu Kauf stehende Kreuze, Gedächtnistafeln und Monumente ein zweites, unbehaustes Gräberfeld bilden, regte sich nichts, und das byzantinische Bauwerk der Aussegnungshalle lag schweigend im Abglanz des scheidenden Tages.",
        "Ihre Stirnseite, mit griechischen Kreuzen und hieratischen Schildereien in lichten Farben geschmückt, weist überdies symmetrisch angeordnete Inschriften in Goldlettern auf, ausgewählte, das jenseitige Leben betreffende Schriftworte, wie etwa: „Sie gehen ein in die Wohnung Gottes“ oder: „Das ewige Licht leuchte ihnen“; und der Wartende hatte während einiger Minuten eine ernste Zerstreuung darin gefunden, die Formeln abzulesen und sein geistiges Auge in ihrer durchscheinenden Mystik sich verlieren zu lassen, als er, aus seinen Träumereien zurückkehrend, im Portikus, oberhalb der beiden apokalyptischen Tiere, welche die Freitreppe bewachen, einen Mann bemerkte, dessen nicht ganz gewöhnliche Erscheinung seinen Gedanken eine völlig andere Richtung gab."
      ],
      [
        "Ob er nun aus dem Innern der Halle durch das bronzene Tor hervorgetreten oder von außen unversehens heran- und hinaufgelangt war, blieb ungewiß. Aschenbach, ohne sich sonderlich in die Frage zu vertiefen, neigte zur ersteren Annahme. Mäßig hochgewachsen, mager, bartlos und auffallend stumpfnäsig, gehörte der Mann zum rothaarigen Typ und besaß dessen milchige und sommersprossige Haut. Offenbar war er durchaus nicht bajuwarischen Schlages: wie denn wenigstens der breit und gerade gerandete Basthut, der ihm den Kopf bedeckte, seinem Aussehen ein Gepräge des Fremdländischen und Weitherkommenden verlieh.",
        "Freilich trug er dazu die landesübliche Rucksack-Bürde um die Schultern geschnallt, einen gelblichen Gurtanzug aus Lodenstoff, wie es schien, einen grauen Wetterkragen über dem linken Unterarm, den er in die Weiche gestützt hielt, und in der Rechten einen mit eiserner Spitze versehenen Stock, welchen er schräg gegen den Boden stemmte und auf dessen Krücke er, bei gekreuzten Füßen, die Hüfte lehnte. Erhobenen Hauptes, so daß an seinem hager dem losen Sporthemd entwachsenden Halse der Adamsapfel stark und nackt hervortrat, blickte er mit zwei farblosen, rotbewimperten Augen scharf in die Weite."
      ]
    ]
  },
  "verwandlung": {
    "pages": [
      [
        "Als Gregor Samsa eines Morgens aus unruhigen Träumen erwachte, fand er sich in seinem Bett zu einem ungeheueren Ungeziefer verwandelt. Er lag auf seinem panzerartig harten Rücken und sah, wenn er den Kopf ein wenig hob, seinen gewölbten, braunen, von bogenförmigen Versteifungen geteilten Bauch, auf dessen Höhe sich die Bettdecke, zum gänzlichen Niedergleiten bereit, kaum noch erhalten konnte. Seine vielen, im Vergleich zu seinem sonstigen Umfang kläglich dünnen Beine flimmerten ihm hilflos vor den Augen.",
        "„Was ist mit mir geschehen?“ dachte er. Es war kein Traum. Sein Zimmer, ein richtiges, nur etwas zu kleines Menschenzimmer, lag ruhig zwischen den vier wohlbekannten Wänden. Über dem Tisch, auf dem eine auseinandergepackte Musterkollektion von Tuchwaren ausgebreitet war – Samsa war Reisender –, hing das Bild, das er vor kurzem aus einer illustrierten Zeitschrift ausgeschnitten und in einem hübschen, vergoldeten Rahmen untergebracht hatte. Es stellte eine Dame dar, die, mit einem Pelzhut und einer Pelzboa versehen, aufrecht dasaß und einen schweren Pelzmuff, in dem ihr ganzer Unterarm verschwand, dem Beschauer entgegenhob."
      ],
      [
        "Gregors Blick richtete sich dann zum Fenster, und das trübe Wetter – man hörte Regentropfen auf das Fensterblech aufschlagen – machte ihn ganz melancholisch. „Wie wäre es, wenn ich noch ein wenig weiterschliefe und alle Narrheiten vergäße“, dachte er, aber das war gänzlich undurchführbar, denn er war gewöhnt, auf der rechten Seite zu schlafen, konnte sich aber in seinem gegenwärtigen Zustand nicht in diese Lage bringen. Mit welcher Kraft er sich auch auf die rechte Seite warf, immer wieder schaukelte er in die Rückenlage zurück.",
        "Er versuchte es wohl hundertmal, schloß die Augen, um die zappelnden Beine nicht sehen zu müssen, und ließ erst ab, als er in der Seite einen noch nie gefühlten, leichten, dumpfen Schmerz zu spüren begann. „Ach Gott“, dachte er, „was für einen anstrengenden Beruf habe ich gewählt! Tag aus, Tag ein auf der Reise. Die geschäftlichen Aufregungen sind viel größer, als im eigentlichen Geschäft zu Hause, und außerdem ist mir noch diese Plage des Reisens auferlegt, die Sorgen um die Zuganschlüsse, das unregelmäßige, schlechte Essen, ein immer wechselnder, nie andauernder, nie herzlich werdender menschlicher Verkehr. Der Teufel soll das alles holen!“"
      ],
      [
        "Er fühlte ein leichtes Jucken oben auf dem Bauch; schob sich auf dem Rücken langsam näher zum Bettpfosten, um den Kopf besser heben zu können; fand die juckende Stelle, die mit lauter kleinen weißen Pünktchen besetzt war, die er nicht zu beurteilen verstand; und wollte mit einem Bein die Stelle betasten, zog es aber gleich zurück, denn bei der Berührung umwehten ihn Kälteschauer.",
        "Er glitt wieder in seine frühere Lage zurück. „Dies zeitige Aufstehen“, dachte er, „macht einen ganz blödsinnig. Der Mensch muß seinen Schlaf haben. Andere Reisende leben wie Haremsfrauen. Wenn ich zum Beispiel im Laufe des Vormittags ins Gasthaus zurückgehe, um die erlangten Aufträge zu überschreiben, sitzen diese Herren erst beim Frühstück. Das sollte ich bei meinem Chef versuchen; ich würde auf der Stelle hinausfliegen. Wer weiß übrigens, ob das nicht sehr gut für mich wäre.“"
      ],
      [
        "„Wenn ich mich nicht wegen meiner Eltern zurückhielte, ich hätte längst gekündigt, ich wäre vor den Chef hingetreten und hätte ihm meine Meinung von Grund des Herzens aus gesagt. Vom Pult hätte er fallen müssen! Es ist auch eine sonderbare Art, sich auf das Pult zu setzen und von der Höhe herab mit dem Angestellten zu reden, der überdies wegen der Schwerhörigkeit des Chefs ganz nahe herantreten muß. Nun, die Hoffnung ist noch nicht gänzlich aufgegeben; habe ich einmal das Geld beisammen, um die Schuld der Eltern an ihn abzuzahlen – es dürfte noch fünf bis sechs Jahre dauern –, mache ich die Sache unbedingt. Dann wird der große Schnitt gemacht.“",
        "Vorläufig allerdings mußte er aufstehen, denn sein Zug fuhr um fünf Uhr. Und er sah zur Weckuhr hinüber, die auf dem Kasten tickte. „Himmlischer Vater!“ dachte er. Es war halb sieben Uhr, und die Zeiger gingen ruhig vorwärts, es war sogar halb vorüber, es näherte sich schon drei Viertel. Sollte der Wecker nicht geläutet haben? Man sah vom Bett aus, daß er auf vier Uhr richtig eingestellt war; gewiß hatte er auch geläutet. Ja, aber war es möglich, dieses möbelerschütternde Läuten ruhig zu verschlafen?"
      ]

  "schach": {
    "pages": [
      [
        "Auf dem großen Passagierdampfer, der um Mitternacht von New York nach Buenos Aires abgehen sollte, herrschte die übliche Geschäftigkeit und Bewegung der letzten Stunde. Gäste vom Land drängten durcheinander, um ihren Freunden das Geleit zu geben, Telegraphenboys mit schiefen Mützen schossen Namen ausrufend durch die Gesellschaftsräume, Koffer und Blumen wurden geschleppt, Kinder liefen treppauf und treppab, während das Orchester unerschütterlich zur Deckshow spielte.",
        "Ich stand, im Gespräch mit einem Bekannten, etwas abseits von diesem Getümmel auf dem Promenadendeck, als neben uns zweimal oder dreimal scharf Blitzlicht aufzuckte; anscheinend war irgendein Prominenter knapp vor der Abfahrt noch von Reportern rasch interviewt und photographiert worden. Mein Freund blickte hin und lächelte. „Sie haben da einen raren Vogel an Bord, den Czentovic.“ Und da ich offenbar ein ziemlich verständnisloses Gesicht zu dieser Mitteilung machte, fügte er erklärend bei: „Mirko Czentovic, der Weltschachmeister. Er hat ganz Amerika von Ost nach West mit Turnierspielen abgeklappert und fährt jetzt zu neuen Triumphen nach Argentinien.“"
      ],
      [
        "In der Tat erinnerte ich mich nun an diesen jungen Weltmeister und sogar an einiges Detail im Zusammenhang mit seiner raketenhaften Karriere; mein Freund, ein aufmerksamerer Zeitungsleser als ich, wußte sie durch eine ganze Reihe von Anekdoten zu ergänzen. Czentovic hatte sich vor etwa einem Jahr mit einem Schlage neben die altbewährten Matadore der Schachkunst wie Aljechin, Capablanca, Tartakower, Lasker, Bogoljubow gestellt.",
        "Seit dem Auftreten des siebenjährigen Wunderkindes Rzeschewski bei dem Schachturnier 1922 in New York hatte noch nie der Einbruch eines völligen Unbekannten in die ruhmreiche Gilde soviel Aufsehen erregt. Denn Mirko Czentovic’ geistige Qualitäten schienen durchaus keine so blendende Laufbahn von vornherein zu weissagen. Bald sickerte das Geheimnis durch, daß dieser Champion in seinem privaten Leben unfähig war, in irgendeiner Sprache einen Satz ohne orthographische Fehler niederzuschreiben, und daß, wie einer seiner erbitterten Kollegen boshaft spöttelte, „seine Unbildung auf allen Gebieten ebenso universell sei wie sein Geiz“."
      ],
      [
        "Er war der Sohn eines blutarmen südslawischen Donauschiffers, dessen kleine Barke eines Nachts von einem Getreidedampfer überrannt worden war, und nach dem Tode des Vaters hatte der Pfarrer des abgelegenen Ortes den damals zwölfjährigen, dumpfen, breitstirnigen, schweigsamen Knaben aus Barmherzigkeit zu sich genommen. Alles, was der gute Geistliche sich bemühte, dem maulfaulen, schläfrigen Jungen durch häuslichen Nachhilfeunterricht beizubringen, blieb vergeblich.",
        "Mirko starrte die ihm schon hundertmal erklärten Buchstaben immer wieder wie neu an; auch für die einfachsten Unterrichtsgegenstände arbeitete sein schwerfällig funktionierendes Gehirn ohne die mindeste behaltende Kraft. Beim Rechnen mußte er mit vierzehn Jahren noch immer die Finger zu Hilfe nehmen, und ein Buch oder eine Zeitung zu lesen bedeutete für den schon Halbwüchsigen noch besondere Anstrengung. Dabei konnte man Mirko keineswegs unwillig oder widerspenstig nennen; er tat gehorsam, was man ihm gebot, holte Wasser, hackte Holz, arbeitete auf dem Felde mit, räumte die Küche auf und erledigte verläßlich, wenn auch mit einer ärgerlichen Langsamkeit, jeden geforderten Dienst."
      ],
      [
        "Was aber den guten Pfarrer an dem querköpfigen Jungen am meisten verdroß, war seine völlige Teilnahmslosigkeit. Er tat nichts, ohne daß man ihn besonders aufforderte, stellte niemals eine Frage, spielte nicht mit anderen Knaben und suchte sich von selbst keinerlei Beschäftigung, sobald man ihn nicht ausdrücklich zu einer anhielt; hatte er sein Tagwerk im Haushalt abgetan, so saß er stur in der Stube herum mit jenem leeren Blick, den die Schafe auf der Weide haben, ohne an dem geringsten Vorgang rings um sich Anteil zu nehmen.",
        "Abends aber, während der Pfarrer, die lange Bauernpfeife schmauchend, seine drei üblichen Schachpartien mit dem Wachtmeister der Gendarmerie spielte, hockte der schweigsame Bursche mit strähnigem Blondhaar stumm daneben und starrte unter den schweren Lidern scheinbar schläfrig und gleichgültig auf das karierte Brett, bis eines Winterabends ein unerwarteter Zwischenfall seine verborgene Gabe ans Licht riß."
      ]
    ]
  },
  "glasberg": {
    "pages": [
      [
        "In dem schmalen Haus hinter der Gerberei, wo das Wasser des Mühlgrabens selbst im Hochsommer nach gebeizter Rinde und kaltem Eisen roch, wuchs Anselm unter dem Klopfen des Schustereisens auf. Sein Vater saß vom ersten Büchsenlicht bis in die späte Dämmerung auf dem niedrigen Dreibeinschemel, einen Riemen über dem Knie, drei eiserne Stifte zwischen den schmalen Lippen, und schlug den Takt einer Geduld, die keine Fragen duldete. Wer Schuhe besohlte, sagte der Alte selten, aber dann mit einer Stimme wie trockenes Holz, der wisse von den Menschen genug: er sehe an den abgelaufenen Absätzen, wer vor sich selber fliehe und wer bloß im Kreise gehe.",
        "Anselm aber blickte, sooft er das Pech im kleinen Tontopf über der Kohlenpfanne rührte, durch das blinde, von Fliegenpunkten getrübte Scheibenglas hinauf nach Norden, wo über den dunklen Tannenrücken bei klarem Frost eine helle, schneidende Kante im Himmelsblau stand. Die Fuhrleute nannten jene Erhebung den Glasberg, obwohl kein Mensch im Kirchspiel je seinen Fuß auf den oberen Grat gesetzt hatte. Im Frühling schien er aus blassem Rauch gefügt, im Herbst aus geschliffenem Quarz, der das letzte Abendlicht noch hielt, wenn unten in den Gassen längst die Kienspäne brannten."
      ],
      [
        "In seinem neunzehnten Jahr kam ein fahrender Uhrenflicker und Steinschleifer durch das Tal, ein hagerer Mann mit grauen Schläfen und einem Wachstuchranzen, in dem geschliffene Linsen in wollenen Tüchern lagen. Er ließ sich ein Paar abgetretene Schnallenschuhe flicken, saß zwei Stunden auf der Bank vor der Werkstatt und hielt Anselm ein dreikantiges Prisma vor die Augen. Als der Junge hindurchsah, zerfiel die graue Mauer des gegenüberliegenden Kornspeichers in sieben glühende Säume, als brenne im Kalkstein ein verborgenes Feuer.",
        "„Du siehst nur das Getrennte“, sagte der Fremde und schloß das Glas wieder in sein Tuch. „Unten im Tal ist alles gemischt und schwer wie Lehm. Erst wo der Stein durchsichtig wird, erkennt einer, was sein eigener Schatten wiegt. Aber wer hinaufsteigt, darf an den Zollstätten der Täler nichts behalten, woran seine Finger hängen.“ Am nächsten Morgen war der Fremde fort, doch auf dem Fenstersims lag ein schmaler Splitter klaren Bergkristalls, scharf genug, um die Haut an der Daumenkuppe zu ritzen."
      ],
      [
        "Drei Wochen darauf, als die ersten Nebel aus den Wiesen stiegen und die wilden Gänse hoch über dem Kirchturm nach Süden zogen, schnürte Anselm sein Bündel. Er nahm ein Laib Roggenbrot, das kleine Schustermesser mit dem Heft aus Hirschhorn und das flache Notizbuch seiner verstorbenen Mutter, in das sie einst Kräuternamen und Gebete mit blasser Gallustinte eingetragen hatte. Er trat nicht durch die Haustür, deren Glocke geschellt hätte, sondern stieg über die niedrige Gartenmauer in den nassen Klee hinaus.",
        "Im ersten Tal, das man die Weidenmulde nannte, stand das Wasser knöcheltief zwischen den grauen Stämmen. Eine alte Fährfrau saß an einer steinernen Furt vor einem kleinen Feuer aus nassem Reisig. Als Anselm über die Steine setzen wollte, hob sie nicht den Kopf, sondern streckte nur die offene Hand aus. „Silber habe ich keines“, sagte Anselm. „Silber rostet im Moor“, gab die Alte zurück, „gib mir das Messer, mit dem du dein Brot schneidest und deine Sohlen richtest; wer oben schneiden will, zerbricht den Berg.“"
      ],
      [
        "Anselm zögerte, wog das warme Hornheft in der Hand und legte es endlich auf den flachen Uferstein. Sobald er das andere Ufer erreichte, fühlte er eine seltsame Leichtigkeit in den Schultern, als wäre mit dem Stahl auch der Zwang von ihm abgefallen, jedes Ding auf seinen Nutzen hin zu prüfen. Der Pfad stieg nun steiler durch einen Buchenwald, dessen gelbes Laub ohne Wind von den Zweigen sank, Blatt um Blatt, in einer großen, feierlichen Stille.",
        "Gegen Mittag trat er auf eine Hochfläche hinaus, und vor ihm erhob sich die erste Stufe des Glasberges: keine Wand aus Eis, sondern gewaltige, sechskantige Stufen aus bläulichem Gestein, in denen sein eigenes Spiegelbild ihm hundertfach, gebrochen und fremd, entgegentrat. Unter der großen, weißen Herbstsonne begriff er, daß der Weg nach oben kein Ergreifen sein würde, sondern ein langsames Durchsichtigwerden."
      ]
    ]
  },
  "weissfluss": {
    "pages": [
      [
        "Den Namen des Flusses hatten sie schon im November aus den Meldekarten gestrichen; in den Funksprüchen hieß er nur noch Abschnitt Vier, und für uns, die wir im Kellergewölbe des gesprengten Zollhauses lagen, war er der Weiße Fluss, weil das Eis auf ihm nicht spiegelte, sondern unter einer verwehten Kruste aus gefrorenem Kalkstaub und altem Schnee wie ein breites Leinentuch zwischen den Uferböschungen lag.",
        "Von der steinernen Brücke standen noch zwei Pfeiler und der mittlere Bogen, über den die Pioniere im Oktober Bohlen aus rohem Kiefernholz gelegt hatten. Jedesmal, wenn der Ostwind durch die eisernen Geländerstäbe strich, gab das Holzwerk ein trockenes Knarren von sich, wie ein Dachstuhl, der unter einer zu schweren Schneelast nachgibt. Wir waren zu dritt: Buchholz, der vor dem Krieg in einer Druckerei in Magdeburg Bleilettern gesetzt hatte, der neunzehnjährige Kersten mit den erfrorenen Ohrläppchen, und ich."
      ],
