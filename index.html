<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Sites</title>
<style>
:root{--bg:#0b0b0b;--fg:#f2f2f2;--muted:#8a8a8a;--line:#222;--card:#141414}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif;padding:48px 24px}
h1{font-weight:500;font-size:28px;letter-spacing:-.01em}
p{color:var(--muted);margin-top:6px}
.grid{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:1400px}
a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}
.shot{aspect-ratio:16/10;background:#0f0f0f;border-bottom:1px solid var(--line);overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .4s}
a:hover .shot img{transform:scale(1.03)}
.shot.ph{display:grid;place-items:center;font-size:20px;font-weight:500;color:#555;background:linear-gradient(135deg,#1a1a1a,#0e0e0e)}
.body{padding:16px 20px 18px}
a:hover{border-color:#555;transform:translateY(-2px)}
a b{display:block;font-weight:500}
a span{font-size:12px;color:var(--muted)}
a p{font-size:13px;line-height:1.45;margin:6px 0 8px;color:#bdbdbd}
.all{display:inline-block;margin-top:20px;background:#fff;color:#000;padding:10px 18px;border-radius:999px;border:0;font:inherit;cursor:pointer}
</style>
</head>
<body>
<h1>Motion Sites</h1>
<p>Click a site to open it in a new tab.</p>
<button class="all" id="all">Open all</button>
<div class="grid" id="grid"></div>
<script>
var sites = [
  ['Atelier', 'atelier/', 'Smart farming company: sensors, robotics and precision irrigation for farms.'],
  ['Aurea Gärten', 'aurea-gaerten/dist/', 'Landscape architecture and garden design studio in Munich, Berlin and Hamburg.'],
  ['Norva', 'norva/dist/', 'Industrial services staffing: AI scheduling and vetted crews for maintenance and turnarounds.'],
  ['Fadenwerk', 'fadenwerk/', 'Clothing brand whose garments are rendered live from procedural fabric, no photos.'],
  ['Kernwald', 'kernwald/', 'Sovereign cloud hosting from a data centre under the Black Forest.'],
  ['KV Fracht', 'kv-fracht/', 'Freight forwarder: air, sea, customs, warehousing and project cargo.'],
  ['Nektarlinie', 'nektarlinie/', 'Self-service ad-tech studio for curating programmatic inventory.'],
  ['Ribbon', 'Ribbon/', 'Mind-Merit studio portfolio: a ribbon of video work that lands in a grid.'],
  ['Sockel', 'sockel/', 'Architecture atlas of invented buildings, with a 3D book ribbon and shelf.'],
  ['Tiefenpfad', 'tiefenpfad/', 'Compare and book cave tours in Germany, with a 3D preview.'],
  ['Lumen Roof', 'lumen-roof/dist/', 'Solar roof, battery and power tariff with zero electricity bills for 7 years.'],
  ['Mythen-Atlas', 'mythen-atlas/dist/', 'Interactive 3D field guide to mythical creatures like a phoenix and a kraken.'],
  ['Offcut', 'offcut/dist/', 'Dark streetwear archive: 3D clothing rail plus a 360° spin product section.'],
  ['Runway', 'runway/dist/', 'Streetwear runway shop with six looks you can explore piece by piece.'],
  ['Wendland-Bibliothek', 'wendland-bibliothek/dist/', 'Curated archive of classic German literature and original works.']
];
var shots = {
  'Atelier': 'atelier', 'Fadenwerk': 'fadenwerk', 'Kernwald': 'kernwald', 'KV Fracht': 'kv-fracht',
  'Nektarlinie': 'nektarlinie', 'Sockel': 'sockel', 'Tiefenpfad': 'tiefenpfad', 'Lumen Roof': 'lumen-roof',
  'Mythen-Atlas': 'mythen-atlas', 'Offcut': 'offcut', 'Wendland-Bibliothek': 'wendland',
  'Aurea Gärten': 'aurea', 'Norva': 'norva', 'Ribbon': 'ribbon', 'Runway': 'runway'
};
var g = document.getElementById('grid');
sites.forEach(function (s) {
  var a = document.createElement('a');
  a.href = encodeURI(s[1]); a.target = '_blank';
  var img = shots[s[0]]
    ? '<div class="shot"><img src="_launcher/shots/' + shots[s[0]] + '.png" alt="" loading="lazy"></div>'
    : '<div class="shot ph">' + s[0] + '</div>';
  a.innerHTML = img + '<div class="body"><b>' + s[0] + '</b><p>' + s[2] + '</p><span>' + s[1] + '</span></div>';
  g.appendChild(a);
});
document.getElementById('all').onclick = function () {
  sites.forEach(function (s) { window.open(encodeURI(s[1]), '_blank'); });
};
</script>
</body>
</html>
